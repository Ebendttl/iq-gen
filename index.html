<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQ Gen — AI Interview Question Generator</title>
  <meta name="description" content="Generate thoughtful, role-specific interview questions powered by Google Gemini AI. Paste a job title and get 3 expert-crafted questions instantly.">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>

  <main class="container">

    <!-- ================================================================
         Theme Toggle
         ================================================================ -->
    <div class="header-controls">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>

    <!-- ================================================================
         Settings Panel — collapsible API key input
         ================================================================ -->
    <section id="settings-panel" class="settings-panel">
      <button type="button" id="settings-toggle" class="settings-toggle" aria-expanded="false" aria-controls="settings-body">
        <span class="settings-toggle__icon">▸</span>
        Settings
      </button>
      <div id="settings-body" class="settings-body">
        <label for="api-key-input">Gemini API Key</label>
        <div class="settings-row">
          <input
            type="password"
            id="api-key-input"
            class="api-key-input"
            placeholder="Paste your API key here…"
            autocomplete="off"
          >
          <button type="button" id="save-key-btn" class="btn-save-key">Save Key</button>
        </div>
        <p id="key-status" class="key-status" aria-live="polite"></p>
      </div>
    </section>

    <!-- ================================================================
         Hero Header
         ================================================================ -->
    <header class="hero">
      <h1>IQ Gen<span class="accent-dot">.</span></h1>
      <p class="subtitle">AI-powered interview questions, tailored to any role.</p>
    </header>

    <!-- ================================================================
         Question Form
         ================================================================ -->
    <form id="question-form" novalidate>
      <div class="form-group">
        <label for="job-title-input">Job Title</label>
        <input
          type="text"
          id="job-title-input"
          class="form-input"
          value="Customer Success Manager"
          autocomplete="off"
        >
        <p id="validation-message" class="validation-message" aria-live="polite"></p>
      </div>
      <div class="form-actions">
        <button type="submit" id="generate-btn" class="btn-primary">Generate Questions</button>
        <button type="button" id="clear-btn" class="btn-secondary">Clear</button>
      </div>
    </form>

    <!-- ================================================================
         Results — cards, skeletons, or error banner rendered here by JS
         ================================================================ -->
    <section id="results" aria-live="polite"></section>

    <!-- ================================================================
         Footer
         ================================================================ -->
    <footer class="footer">
      <p>Built with the <a href="https://ai.google.dev/" target="_blank" rel="noopener noreferrer">Gemini API</a></p>
    </footer>

  </main>

</body>
</html>
