<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients, Filters, and Fonts -->
  <defs>
    <!-- Premium drop shadow for the speech bubble to give it depth -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Dark Navy Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#131422"/>

  <!-- Group for the Speech Bubble with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Speech Bubble Main Card -->
    <rect x="128" y="136" width="232" height="152" rx="32" fill="#ffffff"/>
    
    <!-- Speech Bubble Tail -->
    <path d="M 148 284 L 148 336 L 208 284 Z" fill="#ffffff" stroke-linejoin="round"/>
    
    <!-- Text Lines Inside Bubble -->
    <!-- Highlighted Orange Line -->
    <rect x="156" y="166" width="60" height="10" rx="5" fill="#e05638"/>
    <!-- Light Gray Lines -->
    <rect x="156" y="192" width="168" height="8" rx="4" fill="#e2e4e9"/>
    <rect x="156" y="212" width="136" height="8" rx="4" fill="#e2e4e9"/>
  </g>

  <!-- Four-Pointed Spark/Star with Circular Cutout in Top Right -->
  <!-- Center of spark is at cx="340", cy="150" -->
  <path d="M 340 100 
           Q 340 150 390 150 
           Q 340 150 340 200 
           Q 340 150 290 150 
           Q 340 150 340 100 Z" 
        fill="#e05638"/>
  
  <!-- Hollow Circular Cutout in the center of the Spark -->
  <circle cx="340" cy="150" r="10" fill="#131422"/>

  <!-- "IQ." Text at the bottom -->
  <g transform="translate(256, 396)">
    <!-- Elegant Serif IQ Text -->
    <text x="-48" y="0" 
          font-family="Georgia, serif" 
          font-size="64" 
          font-weight="bold" 
          fill="#ffffff" 
          letter-spacing="2">IQ</text>
    <!-- Glowing Orange Accent Dot -->
    <circle cx="34" cy="-14" r="10" fill="#e05638"/>
  </g>
</svg>
