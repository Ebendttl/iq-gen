<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#0f0f16"/>
    </radialGradient>
    
    <!-- Glowing Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    
    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff6b6b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Styled 'Q' Element formed by interlocking rings -->
  <!-- Main Ring (Cyan) -->
  <circle cx="236" cy="236" r="110" fill="none" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round"/>
  
  <!-- Outer Arc / Tail (Orange) -->
  <path d="M 236 346 A 110 110 0 0 0 346 236 M 310 310 L 390 390" fill="none" stroke="url(#orangeGrad)" stroke-width="32" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Glowing Synapse / Spark Core -->
  <circle cx="236" cy="236" r="30" fill="url(#orangeGrad)"/>
</svg>
